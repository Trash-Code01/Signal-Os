services:
  # 1. FastAPI + Celery Backend (Docker)
  - type: web
    name: devacia-api
    env: docker
    rootDir: apps/api
    plan: free
    region: ohio
    dockerCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: devacia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: devacia-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DISCOVERY_MODE
        value: live
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: SNOVIO_CLIENT_ID
        sync: false
      - key: SNOVIO_CLIENT_SECRET
        sync: false
      - key: PROXYCURL_API_KEY
        sync: false

  # 2. Next.js Frontend (Docker)
  - type: web
    name: devacia-web
    env: docker
    rootDir: apps/web
    plan: free
    region: ohio
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: devacia-api
          envVarKey: RENDER_EXTERNAL_URL

  # 3. Redis Memory Cache
  - type: redis
    name: devacia-redis
    plan: free
    region: ohio
    ipAllowList: []

databases:
  # 4. PostgreSQL Database
  - name: devacia-db
    databaseName: devacia_os
    user: devacia
    plan: free
    region: ohio
    ipAllowList: []

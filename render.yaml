services:
  # 1. FastAPI + Celery Backend (Docker)
  - type: web
    name: devacia-backend
    env: docker
    rootDir: apps/api
    plan: free
    region: ohio
    dockerCommand: "bash start.sh"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: devacia-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_CLIENT_ID
        value: 991104064928-r9v2tcb04lpgjo412np3tr1riep2gjeq.apps.googleusercontent.com
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: DISCOVERY_MODE
        value: live
      - key: GROQ_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: SNOVIO_CLIENT_ID
        sync: false
      - key: SNOVIO_CLIENT_SECRET
        sync: false
      - key: PROXYCURL_API_KEY
        sync: false
      # Optional direct link to this service's Environment page. It is safe to
      # expose to the authenticated UI and lets operators jump from an
      # exhausted-credit alert straight to the place where Render keys change.
      - key: RENDER_ENVIRONMENT_URL
        sync: false
      # Set this to the public Devacia frontend URL. Keeping it explicit avoids
      # credentialed CORS requests from arbitrary origins.
      - key: FRONTEND_ORIGIN
        value: https://devacia-frontend.onrender.com

  # 2. Next.js Frontend (Docker)
  - type: web
    name: devacia-frontend
    env: docker
    rootDir: apps/web
    plan: free
    region: ohio
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: devacia-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_URL
        fromService:
          type: web
          name: devacia-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 991104064928-r9v2tcb04lpgjo412np3tr1riep2gjeq.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_ID
        value: 991104064928-r9v2tcb04lpgjo412np3tr1riep2gjeq.apps.googleusercontent.com

  # 3. Redis Memory Cache
  - type: redis
    name: devacia-redis
    plan: free
    region: ohio
    ipAllowList: []

databases:
  # 4. PostgreSQL Database
  - name: devacia-db
    databaseName: devacia_os
    user: devacia
    plan: free
    region: ohio
    ipAllowList: []
